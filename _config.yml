title: ClearCents
tagline: "Making cents of your money"
description: "Practical budgeting, saving strategies, and side hustle tips for real people living on real salaries. No fluff — just what works."

# ─────────────────────────────────────────────────────────────
# HOSTING URLS — custom domain active
# ─────────────────────────────────────────────────────────────
url: "https://clearcentslife.com"
baseurl: ""

author:
  name: ClearCents
  email: hello@clearcents.com
  twitter: clearcents
  pinterest: clearcents

timezone: America/New_York
encoding: utf-8
lang: en

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:categories/:title/

kramdown:
  input: GFM
  syntax_highlighter: rouge

# Plugins (all GitHub Pages compatible)
plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-paginate

# Pagination
paginate: 9
paginate_path: "/page:num/"

# jekyll-seo-tag settings
twitter:
  username: clearcents
  card: summary_large_image

social:
  name: ClearCents
  links:
    - https://twitter.com/clearcents
    - https://pinterest.com/clearcents

logo: /assets/images/logo.png

# AdSense — replace XXXXXXXXXXXXXXXX with your publisher ID after approval
adsense_publisher_id: "ca-pub-XXXXXXXXXXXXXXXX"

# Google Analytics — replace with your GA4 measurement ID
google_analytics: "G-XXXXXXXXXX"

# Blog categories shown in navigation
nav_categories:
  - name: Budgeting
    icon: "💰"
  - name: Save Money
    icon: "🏦"
  - name: Side Hustles
    icon: "⚡"
  - name: Debt Free
    icon: "✂️"
  - name: Investing
    icon: "📈"

# Feed
feed:
  path: feed.xml

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      comments: false
      share: true

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - automation/
  - .env
  - .env.local
  - vendor/
  - node_modules/
  - "*.sh"
  - ".github/workflows/autopost.yml"
